<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dimensions Converter</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body{
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background: linear-gradient(135deg, #667eea, #764ba2);
      padding:20px;
    }

    .container{
      background:white;
      width:100%;
      max-width:500px;
      padding:35px;
      border-radius:25px;
      box-shadow:0 10px 30px rgba(0,0,0,0.2);
      animation: fadeIn 1s ease;
    }

    @keyframes fadeIn{
      from{
        opacity:0;
        transform:translateY(20px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    h1{
      text-align:center;
      color:#5a67d8;
      margin-bottom:10px;
      font-size:32px;
    }

    p{
      text-align:center;
      color:#666;
      margin-bottom:25px;
    }

    .input-group{
      margin-bottom:20px;
    }

    label{
      display:block;
      margin-bottom:8px;
      font-weight:bold;
      color:#444;
    }

    input, select{
      width:100%;
      padding:14px;
      border-radius:12px;
      border:2px solid #ddd;
      font-size:16px;
      transition:0.3s;
    }

    input:focus, select:focus{
      border-color:#667eea;
      outline:none;
    }

    button{
      width:100%;
      padding:15px;
      border:none;
      border-radius:15px;
      background:linear-gradient(135deg,#667eea,#764ba2);
      color:white;
      font-size:18px;
      font-weight:bold;
      cursor:pointer;
      transition:0.3s;
    }

    button:hover{
      transform:scale(1.03);
    }

    .result{
      margin-top:25px;
      background:#f4f7ff;
      padding:20px;
      border-radius:15px;
      text-align:center;
      font-size:24px;
      font-weight:bold;
      color:#333;
      min-height:70px;
    }

    .emoji{
      font-size:40px;
      text-align:center;
      margin-bottom:10px;
    }

    footer{
      text-align:center;
      margin-top:20px;
      color:#777;
      font-size:14px;
    }
  </style>
</head>
<body>

  <div class="container">

    <div class="emoji">📏✨</div>

    <h1>Dimensions Converter</h1>
    <p>Convert km, m, cm and mm easily!</p>

    <div class="input-group">
      <label>Enter Length</label>
      <input type="number" id="value" placeholder="Enter number">
    </div>

    <div class="input-group">
      <label>Convert From</label>
      <select id="fromUnit">
        <option value="km">Kilometers (km)</option>
        <option value="m">Meters (m)</option>
        <option value="cm">Centimeters (cm)</option>
        <option value="mm">Millimeters (mm)</option>
      </select>
    </div>

    <div class="input-group">
      <label>Convert To</label>
      <select id="toUnit">
        <option value="km">Kilometers (km)</option>
        <option value="m">Meters (m)</option>
        <option value="cm">Centimeters (cm)</option>
        <option value="mm">Millimeters (mm)</option>
      </select>
    </div>

    <button onclick="convertUnits()">Convert 🚀</button>

    <div class="result" id="result">
      Your answer will appear here
    </div>

    <footer>
      Made for learners by Elvis Raganya, Student 11151897
    </footer>

  </div>

  <script>
    function convertUnits(){

      const value = parseFloat(document.getElementById("value").value);
      const from = document.getElementById("fromUnit").value;
      const to = document.getElementById("toUnit").value;
      const resultBox = document.getElementById("result");

      if(isNaN(value)){
        resultBox.innerHTML = "⚠️ Please enter a number";
        return;
      }

      const units = {
        km: 1000,
        m: 1,
        cm: 0.01,
        mm: 0.001
      };

      const meters = value * units[from];
      const result = meters / units[to];

      resultBox.innerHTML =
        `${value} ${from} = <br><br> ${result} ${to} 🎉`;
    }
  </script>

</body>
</html>
